<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, height=device-height, viewport-fit=cover">
    <title>Sign In · Little Blossom | School & Daycare</title>
    
    <!-- Custom Favicon (blossom) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='28' fill='%23FFBFA3'/%3E%3Ccircle cx='36' cy='40' r='7' fill='%23FFFFFF'/%3E%3Ccircle cx='64' cy='40' r='7' fill='%23FFFFFF'/%3E%3Ccircle cx='50' cy='56' r='7' fill='%23FFFFFF'/%3E%3C/svg%3E">

    <!-- Tailwind CSS -->
    <script src="tailwind.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontWeight: {
                        bold: '600',
                        extrabold: '600',
                        semibold: '550',
                    },
                    colors: {
                        brand: {
                            primary: '#111111',
                            secondary: '#2E2E2E',
                            muted: '#4A4A4A',
                            border: '#F0E3DC',
                            accent: '#FF8E6C',
                            'accent-dark': '#F27A58',
                            'accent-light': '#FFE0D3',
                            bg: '#FFFFFF',
                            'bg-soft': '#FFF5F0',
                        },
                        custom: {
                            peach: '#FF8E6C',
                            'peach-light': '#FFE0D3',
                        }
                    },
                    fontFamily: {
                        'display': ['"Poppins"', 'system-ui', 'sans-serif'],
                        'body': ['"Inter"', 'system-ui', 'sans-serif'],
                    },
                    backgroundImage: {
                        'warm-pattern': 'radial-gradient(circle at 20% 30%, rgba(255,191,163,0.10) 0%, transparent 60%)',
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-out',
                        'float': 'float 6s ease-in-out infinite',
                        'spin-slow': 'spinSlow 10s linear infinite',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0', transform: 'translateY(10px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                        float: { '0%,100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-6px)' } },
                        spinSlow: { '0%': { transform: 'rotate(0deg)' }, '100%': { transform: 'rotate(360deg)' } },
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Typography Consistency Overrides */
        h1, h2, h3, h4, h5, h6 {
            font-weight: 600 !important;
        }
        p {
            font-weight: 400;
        }
        p strong, p b, p .font-bold, p .font-semibold {
            font-weight: 550 !important;
        }
        .font-extrabold {
            font-weight: 800 !important;
        }
        /* Color Vibrancy Overrides */
        .bg-\[\#FFBFA3\], .bg-brand-accent {
            background-color: #FF8E6C;
        }
        .text-\[\#FFBFA3\], .text-brand-accent {
            color: #FF8E6C;
        }
        .border-\[\#FFBFA3\], .border-brand-accent {
            border-color: #FF8E6C;
        }
        .bg-\[\#FFE6DA\], .bg-brand-accent-light {
            background-color: #FFE0D3;
        }
        .text-\[\#FFE6DA\], .text-brand-accent-light {
            color: #FFE0D3;
        }
        .border-\[\#FFE6DA\], .border-brand-accent-light {
            border-color: #FFE0D3;
        }
        .hover\:bg-\[\#E8A385\]:hover, .hover\:bg-brand-accent-dark:hover {
            background-color: #F27A58;
        }
        .bg-\[\#FFF9F6\], .bg-brand-bg-soft {
            background-color: #FFF5F0;
        }
        .text-\[\#FFF9F6\], .text-brand-bg-soft {
            color: #FFF5F0;
        }
        .border-\[\#FFF9F6\], .border-brand-bg-soft {
            border-color: #FFF5F0;
        }
        /* ----- NO SCROLL — fit exactly one screen ----- */
        html,
        body {
            height: 100%;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #FFFFFF;
            color: #111111;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .dark body {
            background-color: #1A1A1A;
            color: #F5F5F5;
        }

        /* Dark mode fallback text contrast overrides */
        .dark .text-brand-primary {
            color: #F5F5F5;
        }
        .dark .text-brand-secondary {
            color: #E0E0E0;
        }
        .dark .text-brand-muted {
            color: #AAAAAA;
        }
        .dark input,
        .dark select,
        .dark textarea {
            color: #FFFFFF !important;
        }

        /* toggle buttons — positioned top-right */
        .theme-toggle-wrapper {
            position: fixed;
            top: 12px;
            right: 12px;
            z-index: 1000;
            display: flex;
            gap: 6px;
        }

        .toggle-btn {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: white;
            color: #FFBFA3;
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 191, 163, 0.2);
            cursor: pointer;
            font-size: 0.9rem;
        }

        .dark .toggle-btn {
            background: #2A2A2A;
            color: #FFBFA3;
            border-color: rgba(255, 191, 163, 0.3);
        }

        .toggle-btn:hover {
            background: #FFBFA3;
            color: #111111;
        }

        .dark .toggle-btn:hover {
            background: #FFBFA3;
            color: #111111;
        }

        .toggle-btn.active {
            background: #FFBFA3;
            color: #111111;
        }

        .dark .toggle-btn.active {
            background: #FFBFA3;
            color: #111111;
        }

        /* LOGIN CARD */
        .login-card {
            background: #FFFFFF;
            border-radius: 32px;
            padding: 2.2rem 2rem 2rem;
            box-shadow: 0 20px 45px rgba(255, 191, 163, 0.12);
            border: 1px solid #F0E3DC;
            width: 100%;
            max-width: 460px;
            margin: 0 auto;
        }

        .dark .login-card {
            background: #2A2A2A;
            border-color: #3A3A3A;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        /* input styling */
        .login-input {
            width: 100%;
            padding: 0.85rem 1.2rem 0.85rem 3rem;
            border-radius: 50px;
            border: 1px solid #F0E3DC;
            background: #FFFFFF;
            font-size: 0.95rem;
            transition: all 0.2s;
            color: #111111;
        }

        .dark .login-input {
            background: #1A1A1A;
            border-color: #3A3A3A;
            color: #F5F5F5;
        }

        .login-input:focus {
            outline: none;
            border-color: #FFBFA3;
            box-shadow: 0 0 0 3px rgba(255, 191, 163, 0.2);
        }

        .dark .login-input:focus {
            border-color: #FFBFA3;
            box-shadow: 0 0 0 3px rgba(255, 191, 163, 0.25);
        }

        /* password wrapper */
        .password-wrapper {
            position: relative;
            width: 100%;
        }

        .password-wrapper .login-input {
            padding-right: 3rem;
        }

        .toggle-password {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #FFBFA3;
            font-size: 1rem;
            transition: color 0.2s;
            background: transparent;
            border: none;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dark .toggle-password {
            color: #FFBFA3;
        }

        .toggle-password:hover {
            color: #E8A385;
        }

        [dir="rtl"] .toggle-password {
            right: auto;
            left: 1rem;
        }

        [dir="rtl"] .password-wrapper .login-input {
            padding-right: 1.2rem;
            padding-left: 3rem;
        }

        [dir="rtl"] .input-icon {
            left: auto;
            right: 1.1rem;
        }

        /* primary button */
        .btn-primary-school {
            background: #111111;
            color: #FFFFFF;
            font-weight: 600;
            padding: 0.8rem 1.8rem;
            border-radius: 50px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            font-size: 1rem;
            border: none;
            cursor: pointer;
        }

        .btn-primary-school:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 191, 163, 0.4);
            background: #2A2A2A;
        }

        .dark .btn-primary-school {
            background: #FFFFFF;
            color: #111111;
        }

        .dark .btn-primary-school:hover {
            background: #FFE6DA;
            color: #111111;
            box-shadow: 0 8px 20px rgba(255, 191, 163, 0.2);
        }

        /* social login buttons */
        .social-btn-row {
            display: flex;
            gap: 1rem;
            width: 100%;
        }

        .social-btn {
            flex: 1;
            padding: 0.8rem 0.5rem;
            border-radius: 50px;
            border: 1px solid #F0E3DC;
            background: #FFFFFF;
            color: #111111;
            font-weight: 500;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            gap: 0.5rem;
            white-space: nowrap;
            cursor: pointer;
        }

        .dark .social-btn {
            background: #1A1A1A;
            border-color: #3A3A3A;
            color: #F5F5F5;
        }

        .social-btn:hover {
            background: #FFF9F6;
            border-color: #FFBFA3;
            transform: translateY(-2px);
        }

        .dark .social-btn:hover {
            background: #2A2A2A;
            border-color: #FFBFA3;
        }

        .social-btn i {
            font-size: 1.1rem;
            color: #FFBFA3;
        }

        /* logo container */
        .logo-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .brand-logo {
            background: #FFBFA3;
            width: 36px;
            height: 36px;
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0;
            box-shadow: 0 4px 10px rgba(255, 191, 163, 0.2);
            transition: all 0.3s ease;
        }

        @media (min-width: 768px) {
            .brand-logo {
                width: 40px;
                height: 40px;
            }
        }

        .welcome-title {
            font-family: 'Poppins', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: #111111;
            margin-top: 1.75rem;
            margin-bottom: 0.25rem;
            text-align: center;
            line-height: 1.2;
        }

        .dark .welcome-title {
            color: #F5F5F5;
        }

        .welcome-subtitle {
            font-size: 0.9rem;
            color: #2E2E2E;
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .dark .welcome-subtitle {
            color: #E0E0E0;
        }

        /* RTL adjustments */
        [dir="rtl"] .login-input {
            padding: 0.85rem 3rem 0.85rem 1.2rem;
        }

        [dir="rtl"] .input-icon {
            left: auto;
            right: 1.1rem;
        }

        [dir="rtl"] .fa-arrow-right {
            transform: scaleX(-1);
        }

        [dir="rtl"] .theme-toggle-wrapper {
            right: auto;
            left: 20px;
        }

        /* Fix for short screens like Nest Hub (1024x600) */
        @media (max-height: 650px) {
            .login-card {
                padding: 0.8rem 1.5rem;
                transform: scale(0.95);
                transform-origin: center;
            }

            .logo-center {
                margin-bottom: 0.5rem;
            }

            .welcome-title {
                font-size: 1.3rem;
                margin-top: 0;
            }

            .welcome-subtitle {
                font-size: 0.8rem;
                margin-bottom: 0.5rem;
            }

            .login-input {
                padding: 0.6rem 0.8rem 0.6rem 2.5rem;
                font-size: 0.85rem;
            }

            .btn-primary-school {
                padding: 0.6rem 1rem;
                font-size: 0.9rem;
                margin-top: 0.25rem;
            }

            .theme-toggle-wrapper {
                top: 8px;
                right: 8px;
            }

            .toggle-btn {
                width: 32px;
                height: 32px;
                font-size: 0.8rem;
            }
        }

        /* responsive */
        @media (max-width: 380px) {
            .login-card {
                padding: 1.5rem 1.2rem;
                border-radius: 24px;
            }

            .logo-center {
                margin-bottom: 1rem;
            }

            .welcome-title {
                font-size: 1.3rem;
            }

            .login-input {
                padding: 0.7rem 1rem 0.7rem 2.8rem;
                font-size: 0.85rem;
            }

            .btn-primary-school {
                padding: 0.7rem 1.5rem;
                font-size: 0.95rem;
            }
        }

        @media (max-width: 480px) {
            .theme-toggle-wrapper {
                top: 12px;
                right: 12px;
            }

            [dir="rtl"] .theme-toggle-wrapper {
                left: 12px;
            }
        }

        .hidden {
            display: none;
        }

        .container-tight {
            max-width: 480px;
            width: 100%;
            padding: 0 1.5rem;
        }

        .text-peach {
            color: #FFBFA3;
        }

        .hover\:text-peach-dark:hover {
            color: #E8A385;
        }

        a {
            transition: all 0.2s ease;
        }
    </style>
</head>

<body class="bg-white dark:bg-[#1A1A1A] warm-pattern">

    <!-- ===== THEME TOGGLES - TOP-RIGHT ===== -->
    <div class="theme-toggle-wrapper">
        <button id="theme-toggle" class="toggle-btn" title="Dark / Light">
            <i class="fas fa-moon"></i>
        </button>
        <button id="rtl-toggle" class="toggle-btn" title="RTL / LTR">
            ⇄
        </button>
    </div>

    <!-- ===== LOGIN CARD ===== -->
    <div class="container-tight">
        <div class="login-card animate-fade-in">

            <!-- ===== LOGO - CENTERED ===== -->
            <div class="logo-center mb-8">
                <a href="index.html" class="flex items-center gap-2 md:gap-3 group shrink-0">
                    <div class="brand-logo group-hover:scale-105 transition duration-300">
                        <i class="fas fa-seedling text-[#111111] text-base md:text-lg"></i>
                    </div>
                    <div>
                        <span class="text-xl md:text-2xl font-display font-extrabold tracking-tight text-[#111111] dark:text-white">LITTLE<span class="text-[#FFBFA3]">BLOSSOM</span></span>
                    </div>
                </a>

                <h1 class="welcome-title">Welcome Back, Parent</h1>
                <p class="welcome-subtitle">Sign in to access your child's progress, updates &amp; community</p>
            </div>

            <!-- ===== LOGIN FORM ===== -->
            <form id="loginForm" class="space-y-5" action="#" method="GET">

                <!-- email field -->
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-peach input-icon">
                        <i class="fas fa-envelope w-5 text-sm"></i>
                    </span>
                    <input type="email" name="email" id="login-email" placeholder="Email address" required
                        class="login-input text-sm md:text-base">
                </div>

                <!-- password field with eye icon -->
                <div class="password-wrapper">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-peach input-icon">
                        <i class="fas fa-lock w-5 text-sm"></i>
                    </span>
                    <input type="password" id="login-password" name="password" placeholder="Password" required
                        class="login-input text-sm md:text-base">
                    <button type="button" class="toggle-password" data-target="login-password"
                        aria-label="Show password">
                        <i class="far fa-eye-slash"></i>
                    </button>
                </div>

                <!-- remember + forgot -->
                <div class="flex items-center justify-between text-xs md:text-sm">
                    <label
                        class="flex items-center space-x-2 rtl:space-x-reverse cursor-pointer text-[#111111] dark:text-white">
                        <input type="checkbox"
                            class="rounded border-[#F0E3DC] dark:border-[#3A3A3A] text-[#FFBFA3] focus:ring-[#FFBFA3]/30 dark:bg-[#2A2A2A]"
                            checked>
                        <span class="ml-1 rtl:mr-1">Remember me</span>
                    </label>
                    <a href="#" id="forgotPasswordLink"
                        class="text-[#111111] dark:text-white hover:text-[#FFBFA3] font-medium transition hover:underline">
                        Forgot password?
                    </a>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-primary-school mt-3">
                    Sign In
                </button>

                <!-- divider -->
                <div class="relative my-4">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-[#F0E3DC] dark:border-[#3A3A3A]"></div>
                    </div>
                    <div class="relative justify-center flex text-xs">
                        <span class="bg-white dark:bg-[#2A2A2A] px-4 py-0.5 text-[#111111] dark:text-white rounded-full">
                            or continue with
                        </span>
                    </div>
                </div>

            </form>

            <!-- ===== SOCIAL LOGIN BUTTONS ===== -->
            <div class="mt-6">
                <div class="grid grid-cols-2 gap-3">
                    <button class="social-btn group w-full flex items-center justify-center gap-2 py-3 px-2 text-sm"
                        onclick="socialLogin('google')">
                        <i class="fab fa-google text-base"></i>
                        <span>Google</span>
                    </button>
                    <button class="social-btn group w-full flex items-center justify-center gap-2 py-3 px-2 text-sm"
                        onclick="socialLogin('apple')">
                        <i class="fab fa-apple text-base"></i>
                        <span>Apple</span>
                    </button>
                </div>
            </div>

            <!-- ===== "NOT A MEMBER? SIGN UP" LINK ===== -->
            <div class="text-center mt-6 pt-4 border-t border-dashed border-[#F0E3DC] dark:border-[#3A3A3A]/40">
                <p class="text-sm md:text-base font-semibold text-[#111111] dark:text-white">
                    New to Little Blossom? 
                    <a href="register.html" class="text-[#FFBFA3] dark:text-[#FFBFA3] hover:text-[#E8A385] font-bold transition ml-1 rtl:mr-1 hover:underline">Sign Up</a>
                </p>
            </div>
        </div>
    </div>


    <!-- ===== SCRIPTS ===== -->
    <script>
            (function () {
                // ---------- THEME TOGGLE ----------
                const themeToggle = document.getElementById('theme-toggle');

                function setTheme(isDark) {
                    if (isDark) {
                        document.documentElement.classList.add('dark');
                    } else {
                        document.documentElement.classList.remove('dark');
                    }

                    const icon = themeToggle?.querySelector('i');
                    if (icon) {
                        icon.classList.remove('fa-sun', 'fa-moon');
                        icon.classList.add(isDark ? 'fa-moon' : 'fa-sun');
                    }

                    if (isDark) {
                        themeToggle?.classList.add('active');
                        localStorage.setItem('theme', 'dark');
                    } else {
                        themeToggle?.classList.remove('active');
                        localStorage.setItem('theme', 'light');
                    }
                }

                // Check for saved theme or system preference
                const savedTheme = localStorage.getItem('theme');
                if (savedTheme === 'dark') {
                    setTheme(true);
                } else if (savedTheme === 'light') {
                    setTheme(false);
                } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    setTheme(true);
                } else {
                    setTheme(false);
                }

                if (themeToggle) {
                    themeToggle.addEventListener('click', (e) => {
                        e.preventDefault();
                        setTheme(!document.documentElement.classList.contains('dark'));
                    });
                }

                // ---------- RTL TOGGLE ----------
                const rtlBtn = document.getElementById('rtl-toggle');
                function setRTL(isRTL) {
                    if (isRTL) {
                        document.documentElement.dir = 'rtl';
                        document.documentElement.lang = 'ar';
                        rtlBtn?.classList.add('active');
                        localStorage.setItem('dir', 'rtl');
                    } else {
                        document.documentElement.dir = 'ltr';
                        document.documentElement.lang = 'en';
                        rtlBtn?.classList.remove('active');
                        localStorage.setItem('dir', 'ltr');
                    }
                }
                const savedDir = localStorage.getItem('dir');
                savedDir === 'rtl' ? setRTL(true) : setRTL(false);

                if (rtlBtn) {
                    rtlBtn.addEventListener('click', (e) => {
                        e.preventDefault();
                        setRTL(document.documentElement.dir !== 'rtl');
                    });
                }

                // ---------- EYE ICON TOGGLE PASSWORD VISIBILITY ----------
                const toggleButtons = document.querySelectorAll('.toggle-password');
                toggleButtons.forEach(button => {
                    button.addEventListener('click', function (e) {
                        e.preventDefault();
                        const targetId = this.getAttribute('data-target');
                        const passwordInput = document.getElementById(targetId);
                        if (passwordInput) {
                            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                            passwordInput.setAttribute('type', type);
                            const icon = this.querySelector('i');
                            if (icon) {
                                if (type === 'text') {
                                    icon.classList.remove('fa-eye-slash');
                                    icon.classList.add('fa-eye');
                                } else {
                                    icon.classList.remove('fa-eye');
                                    icon.classList.add('fa-eye-slash');
                                }
                            }
                        }
                    });
                });

                // ---------- FORGOT PASSWORD HANDLER ----------
                const forgotLink = document.getElementById('forgotPasswordLink');
                if (forgotLink) {
                    forgotLink.addEventListener('click', (e) => {
                        e.preventDefault();
                        alert('🌱 A password reset link will be sent to your email. Please check your inbox!');
                    });
                }

                // ---------- LOGIN FORM HANDLER ----------
                const loginForm = document.getElementById('loginForm');
                if (loginForm) {
                    loginForm.addEventListener('submit', (e) => {
                        e.preventDefault();

                        const email = document.getElementById('login-email')?.value;
                        const password = document.getElementById('login-password')?.value;

                        if (!email || !password) {
                            alert('Please enter both email and password');
                            return;
                        }

                        // Redirect to dashboard or home
                        window.location.href = 'client.html';
                    });
                }

                // ---------- SOCIAL LOGIN HANDLER ----------
                window.socialLogin = function (provider) {
                    alert(`🌸 ${provider.charAt(0).toUpperCase() + provider.slice(1)} login would be implemented here.\n\nWelcome to the Little Blossom community!`);
                };

            })();
    </script>
</body>

</html>
